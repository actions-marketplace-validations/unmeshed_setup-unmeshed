name: Validate live CLI install

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install latest Unmeshed CLI
        uses: ./
      - name: Report installed version
        shell: bash
        run: |
          set -euo pipefail
          output=$(unmeshed version)
          printf '%s\n' "$output"
          pattern='v?([0-9]+\.[0-9]+\.[0-9]+)'
          if [[ ! $output =~ $pattern ]]; then
            echo 'Could not parse the installed Unmeshed CLI version' >&2
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          printf '### Unmeshed CLI validation\n\nInstalled version: `%s`\n' "$version" >> "$GITHUB_STEP_SUMMARY"
